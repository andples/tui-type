# Builds ttyp for each platform when a `v*` tag is pushed and attaches the
# binaries to that tag's GitHub release (created by scripts/release.sh).
# The Homebrew formula downloads these, so installs don't need Rust.
# Running it by hand (workflow_dispatch) builds everything without
# publishing, as a check.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          # musl: fully static, runs on any distro. ring's C only needs a
          # compiler, not musl's headers, so clang stands in for musl-gcc.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      CC_x86_64_unknown_linux_musl: clang
      CC_aarch64_unknown_linux_musl: clang
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test
        run: target/${{ matrix.target }}/release/ttyp --version
        if: matrix.target != 'x86_64-apple-darwin'

      - name: Package
        run: |
          name=ttyp-${{ matrix.target }}
          mkdir "$name"
          cp "target/${{ matrix.target }}/release/ttyp" README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"

      - name: Upload to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # scripts/release.sh creates the release right after pushing the
          # tag; wait for it rather than racing it.
          for _ in $(seq 60); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 10
          done
          gh release upload "$GITHUB_REF_NAME" ttyp-${{ matrix.target }}.tar.gz* --clobber
