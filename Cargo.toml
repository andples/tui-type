[package]
name = "ttyp"
version = "2.3.0"
edition = "2024"
description = "Minimal monkeytype-style typing test for the terminal"
license = "MIT"
repository = "https://github.com/andples/tui-type"
readme = "README.md"
keywords = ["typing", "tui", "monkeytype", "terminal", "ratatui"]
categories = ["command-line-utilities", "games"]
include = ["src/**", "assets/**", "Cargo.toml", "README.md", "LICENSE*"]

[workspace]
members = ["crates/*"]
# `cargo test`/`cargo clippy` at the root cover the client and core; the
# server is opted in with `--workspace` so packaging builds stay lean.
default-members = [".", "crates/ttyp-core"]

[workspace.lints.clippy]
all = "warn"

[dependencies]
ttyp-core = { version = "2.3.0", path = "crates/ttyp-core" }
anyhow = "1.0.104"
base64 = "0.23.1"
rand = "0.10.2"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
directories = "6.0.0"
flate2 = "1.1.10"
fontdue = "0.9.4"
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
toml = "1.1.6"
ureq = { version = "3", features = ["json"] }

# Font rasterizing and zlib are far too slow unoptimized; keep dev builds
# responsive by optimizing dependencies (built once, then cached).
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[lints]
workspace = true
