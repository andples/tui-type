  "<<", "<<EOF", "EOF", "<<<", "|", "||", "&&", ";", "&", "!", "-eq", "-ne", "-lt",
  "-gt", "-le", "-ge", "-z", "-n", "-f", "-d", "-r", "-w", "-s", "==", "!=", "=~",
