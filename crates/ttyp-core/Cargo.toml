[package]
name = "ttyp-core"
version = "2.0.0"
edition = "2024"
description = "UI-free core of ttyp: typing-test engine, word generation, languages and API types"
license = "MIT"
repository = "https://github.com/andples/tui-type"
include = ["src/**", "assets/**", "Cargo.toml", "LICENSE"]

[dependencies]
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.6"

[dev-dependencies]
serde_json = "1.0.151"

[lints]
workspace = true
